[project]
name = "kbpy"
version = "0.1.0"
description = "Multimodal Knowledge Store: preparation worker and EmbeddingGemma 2 inference service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "sentence-transformers==6.1.0",
  "transformers==5.19.0",
  "torch==2.14.1",
  "torchvision",
  "pillow",
  "soundfile",
  "torchcodec",
  "fastapi==0.143.0",
  "uvicorn",
  "psycopg[binary]==3.3.6",
  "procrastinate==3.10.0",
  "boto3==1.43.111",
  "pypdfium2",
  "httpx",
  "python-docx",
  "faster-whisper==1.2.1",
  "rapidocr-onnxruntime==1.4.4",
]
[tool.uv]
package = false

[dependency-groups]
dev = ["openai==3.29.0", "requests"]

# Linux uses CPU-only torch wheels (the tested deployment; avoids ~8 GB of CUDA libraries). GPU hosts: drop these
# sources and re-lock with a CUDA index, then set KB_INFERENCE_DEVICE=cuda.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
