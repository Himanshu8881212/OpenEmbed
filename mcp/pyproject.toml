[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "embed-mcp"
version = "0.1.0"
description = "MCP server that exposes an EMBEd vault as tools for MCP-aware LLMs."
authors = [{ name = "EMBEd" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "mcp>=1.2.0",
]

[project.scripts]
embed-mcp = "embed_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["embed_mcp*"]
