name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04   # CPU only; ~8 GB RAM needed for the model + services
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "26" }
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: hf-embeddinggemma-2-914f7f8 }
      - run: scripts/ci.sh
        env: { PLAYWRIGHT_WITH_DEPS: "1" }
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: ci-logs, path: .ci/ }
